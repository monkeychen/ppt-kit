name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-wheel:
    name: Build Python Wheel & Sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Build Wheel & Tarball
        run: uv build

      - name: Release Wheel on GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz

  build-binaries:
    name: Build Standalone Binary (${{ matrix.os }})
    needs: build-wheel
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            asset_name: pptkit-macos-arm64.tar.gz
          - os: ubuntu-latest
            asset_name: pptkit-linux-x86_64.tar.gz
          - os: windows-latest
            asset_name: pptkit-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Build Standalone Binary (Unix)
        if: runner.os != 'Windows'
        run: |
          uv run --with pyinstaller pyinstaller --noconfirm --onefile --add-data "src/pptkit/gui/static:pptkit/gui/static" --name pptkit src/pptkit/__main__.py
          tar -czvf ${{ matrix.asset_name }} -C dist pptkit

      - name: Build Standalone Binary (Windows)
        if: runner.os == 'Windows'
        run: |
          uv run --with pyinstaller pyinstaller --noconfirm --onefile --add-data "src/pptkit/gui/static;pptkit/gui/static" --name pptkit src/pptkit/__main__.py
          Compress-Archive -Path dist/pptkit.exe -DestinationPath ${{ matrix.asset_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
