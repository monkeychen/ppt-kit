[project]
name = "pptkit"
version = "0.3.0"
description = "Convert slide images and PDFs into editable PPTX presentations"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "python-pptx>=1.0.2",
    "pymupdf>=1.24.0",
    "pillow>=10.3.0",
    "numpy>=1.26.0",
    "scikit-image>=0.23.0",
    "typer>=0.12.0",
    "rapidocr-onnxruntime>=1.3.8",
]

[project.scripts]
pptkit = "pptkit.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pptkit"]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
    "pyright>=1.1.370",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: marks tests requiring external apps or API keys",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "benchmark", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
